<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Soft delete and restore permissions">
  <rect width="900" height="300" fill="#edf2f7"/>
  <text x="450" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a365d">Soft Delete &amp; Restore (RBAC)</text>
  <rect x="40" y="55" width="400" height="210" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a365d">Delete (soft-hide)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">
    <text x="60" y="108">" Manager and Super Admin can delete selected rows</text>
    <text x="60" y="130">" Row is hidden from lists (not permanently erased)</text>
    <text x="60" y="152">" Tick Show deleted to view faded rows</text>
    <text x="60" y="174">" Per-row trash icon or bulk Delete in toolbar</text>
    <rect x="60" y="190" width="320" height="56" rx="6" fill="#f7fafc" stroke="#e2e8f0"/>
    <text x="80" y="214" fill="#718096" font-size="11">Deleted row appears faded with strikethrough styling</text>
    <text x="80" y="232" fill="#718096" font-size="11">Status filter can target Deleted only</text>
  </g>
  <rect x="460" y="55" width="400" height="210" rx="10" fill="#fff" stroke="#c6f6d5" stroke-width="2"/>
  <text x="480" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#276749">Restore</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">
    <text x="480" y="108">" Super Admin only</text>
    <text x="480" y="130">" Per-row Restore button when Show deleted is on</text>
    <text x="480" y="152">" Bulk Restore in toolbar for selected rows</text>
    <text x="480" y="174">" Audit log records delete and restore events</text>
    <rect x="480" y="190" width="320" height="56" rx="6" fill="#f0fff4" stroke="#9ae6b4"/>
    <text x="500" y="214" fill="#276749" font-size="11">Modules: NB, SB, Border, POD, Assets, + more</text>
    <text x="500" y="232" fill="#276749" font-size="11">Click sidebar logo to return to Dashboard</text>
  </g>
</svg>
