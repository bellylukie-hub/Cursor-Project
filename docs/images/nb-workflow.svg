  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="70" width="150" height="70" rx="10" fill="#2b6cb0"/>
    <text x="115" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1. Border</text>
    <text x="115" y="120" text-anchor="middle" font-size="11" fill="#ebf8ff">Entry clearance</text>
    <text x="210" y="108" font-size="28" fill="#2b6cb0">’</text>
