  <text x="136" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4a5568">Operations Team</text>

  <rect x="228" y="156" width="316" height="200" rx="8" fill="#fff" stroke="#e2e8f0"/>
