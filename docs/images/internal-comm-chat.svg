  <text x="642" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#2d3748">Kanyaka Dispatcher</text>
  <text x="642" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096">david.m@truckcontrol.local</text>
  <rect x="600" y="190" width="260" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="620" cy="210" r="14" fill="#805ad5"/>
  <text x="620" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#fff">SA</text>
  <text x="642" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#2d3748">Super Admin</text>
  <text x="642" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096">admin@truckcontrol.local</text>
  <rect x="600" y="248" width="120" height="28" rx="6" fill="#fff" stroke="#cbd5e0"/>
  <text x="660" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4a5568">Cancel</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">
    <text x="580" y="320" font-weight="700" fill="#1a365d">Open contact picker</text>
    <text x="580" y="342">Chat tab ’ + button (sidebar)</text>
    <text x="580" y="362">or ribbon ’ New chat</text>
    <text x="580" y="382">Pick a user ’ direct room opens</text>
