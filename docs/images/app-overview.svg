<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="TruckControl application overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a365d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a365d">TruckControl  Application Overview</text>
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="180" height="110" rx="12" fill="#1a365d"/>
    <text x="140" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Operations</text>
    <text x="140" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bee3f8">NB · SB · Border · POD</text>
    <text x="140" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bee3f8">Position Live · Areas</text>

    <rect x="260" y="80" width="180" height="110" rx="12" fill="#2b6cb0"/>
    <text x="350" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Freight (FMS)</text>
    <text x="350" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ebf8ff">Orders · Routes · Trips</text>
    <text x="350" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ebf8ff">Fleet Registry · Map</text>

    <rect x="470" y="80" width="180" height="110" rx="12" fill="#3182ce"/>
    <text x="560" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Communication</text>
    <text x="560" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ebf8ff">Drivers · Matrix · Email</text>
    <text x="560" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ebf8ff">Helpdesk · Help bot</text>

    <rect x="680" y="80" width="170" height="110" rx="12" fill="#2c5282"/>
    <text x="765" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Administration</text>
    <text x="765" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ebf8ff">Users · Roles · KPI</text>
    <text x="765" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ebf8ff">Permissions · Settings</text>
  </g>
  <rect x="120" y="240" width="660" height="220" rx="16" fill="#fff" stroke="#cbd5e0" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a365d">Typical truck journey in the system</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">
    <rect x="150" y="300" width="110" height="44" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="205" y="327" text-anchor="middle">NB Entry</text>
    <text x="270" y="327" fill="#2b6cb0">’</text>
    <rect x="285" y="300" width="110" height="44" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="340" y="327" text-anchor="middle">Kanyaka</text>
    <text x="405" y="327" fill="#2b6cb0">’</text>
    <rect x="420" y="300" width="110" height="44" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="475" y="327" text-anchor="middle">Offload</text>
    <text x="540" y="327" fill="#2b6cb0">’</text>
    <rect x="555" y="300" width="90" height="44" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="600" y="327" text-anchor="middle">POD</text>
    <text x="655" y="327" fill="#2b6cb0">’</text>
    <rect x="670" y="300" width="90" height="44" rx="8" fill="#fefcbf" stroke="#d69e2e"/>
    <text x="715" y="327" text-anchor="middle">SB Exit</text>
  </g>
  <text x="450" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#718096">All steps tracked with dates, KPI colours, comments, and GPS position</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">
    <circle cx="180" cy="430" r="8" fill="#38a169"/><text x="200" y="434">Green = On track</text>
    <circle cx="360" cy="430" r="8" fill="#dd6b20"/><text x="380" y="434">Orange = Priority</text>
    <circle cx="540" cy="430" r="8" fill="#e53e3e"/><text x="560" y="434">Red = Overdue</text>
  </g>
</svg>
