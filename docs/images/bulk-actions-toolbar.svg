<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="Bulk actions toolbar when rows are selected">
  <rect width="920" height="280" fill="#edf2f7"/>
  <text x="460" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a365d">Bulk Actions Toolbar (checkbox selection)</text>
  <text x="460" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#718096">Appears on NB, SB, Border, POD, and Assets when one or more rows are checked</text>
  <rect x="40" y="72" width="840" height="44" rx="8" fill="#fff" stroke="#cbd5e0"/>
  <rect x="40" y="72" width="96" height="44" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="88" y="99" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#4a5568">3 selected</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2d3748">
    <rect x="148" y="80" width="88" height="28" fill="#fff" stroke="#e2e8f0"/><text x="192" y="98" text-anchor="middle">Send Sms</text>
    <rect x="244" y="80" width="104" height="28" fill="#fff" stroke="#e2e8f0"/><text x="296" y="98" text-anchor="middle">Set trip details</text>
    <rect x="356" y="80" width="88" height="28" fill="#fff" stroke="#e2e8f0"/><text x="400" y="98" text-anchor="middle">Assign Tags</text>
    <rect x="452" y="80" width="88" height="28" fill="#fff" stroke="#e2e8f0"/><text x="496" y="98" text-anchor="middle">Create Task</text>
    <rect x="548" y="80" width="72" height="28" fill="#fff" stroke="#e2e8f0"/><text x="584" y="98" text-anchor="middle">Clear DN</text>
    <rect x="628" y="80" width="104" height="28" fill="#fff" stroke="#e2e8f0"/><text x="680" y="98" text-anchor="middle">Bulk Comments</text>
    <rect x="740" y="80" width="64" height="28" fill="#fff5f5" stroke="#feb2b2"/><text x="772" y="98" text-anchor="middle" fill="#c53030">Delete</text>
  </g>
  <rect x="40" y="130" width="840" height="120" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a365d">How to use</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">
    <text x="60" y="182">1. Tick the checkbox on one or more rows (or use Select all in the table header).</text>
    <text x="60" y="204">2. The toolbar appears above the table with actions for the selected records.</text>
    <text x="60" y="226">3. Choose an action  modal opens for comments, tags, SMS, files, etc.</text>
    <text x="60" y="248">4. Delete soft-hides rows; Super Admin can restore via Restore or Show deleted.</text>
  </g>
  <rect x="40" y="262" width="12" height="12" fill="#2b6cb0" rx="2"/>
  <text x="60" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096">Manager + Super Admin can delete · Super Admin only can restore</text>
</svg>
