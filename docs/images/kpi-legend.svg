<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" role="img" aria-label="KPI colour legend">
  <rect width="700" height="180" fill="#f7fafc"/>
  <text x="350" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a365d">KPI Colour Legend (used across the app)</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="60" width="170" height="80" rx="12" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
    <circle cx="100" cy="100" r="16" fill="#38a169"/>
    <text x="130" y="95" font-size="15" font-weight="700" fill="#276749">Green</text>
    <text x="130" y="115" font-size="12" fill="#4a5568">On Track</text>
    <text x="130" y="130" font-size="11" fill="#718096">Within SLA target</text>
    <rect x="265" y="60" width="170" height="80" rx="12" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <circle cx="305" cy="100" r="16" fill="#dd6b20"/>
    <text x="335" y="95" font-size="15" font-weight="700" fill="#c05621">Orange</text>
    <text x="335" y="115" font-size="12" fill="#4a5568">Priority</text>
    <text x="335" y="130" font-size="11" fill="#718096">Approaching deadline</text>
    <rect x="470" y="60" width="170" height="80" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
    <circle cx="510" cy="100" r="16" fill="#e53e3e"/>
    <text x="540" y="95" font-size="15" font-weight="700" fill="#c53030">Red</text>
    <text x="540" y="115" font-size="12" fill="#4a5568">Overdue</text>
    <text x="540" y="130" font-size="11" fill="#718096">Past SLA target</text>
  </g>
  <text x="350" y="168" text-anchor="middle" font-size="11" fill="#718096">Configure SLA hours: Admin ’ KPI Settings · Helpdesk: Admin ’ Helpdesk SLA Settings</text>
</svg>
